<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=900" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap');
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 720px;
        height: 900px;
        overflow: hidden;
        background: linear-gradient(180deg, #C5E100 0%, #A8C200 100%);
      }

      .scene-content {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 60px 50px 50px 50px;
        box-sizing: border-box;
        overflow: hidden;
      }

      .section-label {
        font-family: 'DM Sans', sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #111111;
        margin-bottom: 14px;
        flex-shrink: 0;
      }

      .headline {
        font-family: 'Bebas Neue', sans-serif;
        font-weight: 400;
        font-size: 90px;
        line-height: 0.9;
        letter-spacing: -0.02em;
        color: #111111;
        text-transform: uppercase;
        flex-shrink: 0;
      }

      .body-copy {
        font-family: 'DM Sans', sans-serif;
        font-weight: 400;
        font-size: 18px;
        line-height: 1.5;
        color: #333333;
        margin-top: 18px;
        max-width: 560px;
        flex-shrink: 0;
      }

      .cards-area {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 22px;
        flex: 1;
        min-height: 0;
      }

      .metric-card {
        background: #1A1A1A;
        border-radius: 12px;
        padding: 20px;
        display: flex;
        align-items: center;
        gap: 20px;
        flex-shrink: 0;
      }

      .card-abbr {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 42px;
        line-height: 1;
        flex-shrink: 0;
        width: 70px;
      }
      .abbr-1 { color: #C5E100; }
      .abbr-2 { color: #A855F7; }
      .abbr-3 { color: #F59E0B; }

      .card-right-col {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
        min-width: 0;
      }

      .card-title {
        font-family: 'DM Sans', sans-serif;
        font-weight: 700;
        font-size: 16px;
        color: #ffffff;
      }

      .card-desc {
        font-family: 'DM Sans', sans-serif;
        font-weight: 400;
        font-size: 14px;
        color: #999999;
        line-height: 1.4;
      }

      .card-verdict {
        font-family: 'DM Sans', sans-serif;
        font-weight: 400;
        font-style: italic;
        font-size: 13px;
        color: #CC4444;
        line-height: 1.3;
      }
      .card-verdict-lime { color: #C5E100; }

      .footer {
        display: flex;
        align-items: center;
        width: 100%;
        margin-top: 18px;
        flex-shrink: 0;
      }
      .footer-handle {
        font-family: 'DM Sans', sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #333333;
      }
      .footer-progress {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        margin-left: 16px;
      }
      .progress-bar {
        flex: 1;
        height: 3px;
        background: rgba(0,0,0,0.18);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }
      .progress-fill {
        position: absolute;
        left: 0; top: 0;
        height: 100%;
        width: [PROGRESS]%;
        background: #111111;
        border-radius: 2px;
      }
      .page-num {
        font-family: 'DM Sans', sans-serif;
        font-weight: 700;
        font-size: 16px;
        color: #333333;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="720" data-height="900">
      <div id="s1" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="scene-content">

          <div class="section-label" id="section-label">[SECTION_LABEL]</div>

          <div class="headline" id="headline">[HEADLINE]</div>

          <div class="body-copy" id="body-copy">[BODY_COPY]</div>

          <div class="cards-area">

            <div class="metric-card" id="card-1">
              <div class="card-abbr abbr-1">[ABBR_1]</div>
              <div class="card-right-col">
                <div class="card-title">[CARD_1_TITLE]</div>
                <div class="card-desc">[CARD_1_DESC]</div>
                <div class="card-verdict">[CARD_1_VERDICT]</div>
              </div>
            </div>

            <div class="metric-card" id="card-2">
              <div class="card-abbr abbr-2">[ABBR_2]</div>
              <div class="card-right-col">
                <div class="card-title">[CARD_2_TITLE]</div>
                <div class="card-desc">[CARD_2_DESC]</div>
                <div class="card-verdict">[CARD_2_VERDICT]</div>
              </div>
            </div>

            <div class="metric-card" id="card-3">
              <div class="card-abbr abbr-3">[ABBR_3]</div>
              <div class="card-right-col">
                <div class="card-title">[CARD_3_TITLE]</div>
                <div class="card-desc">[CARD_3_DESC]</div>
                <div class="card-verdict card-verdict-lime">[CARD_3_VERDICT_ACCENT]</div>
              </div>
            </div>

          </div>

          <div class="footer" id="footer">
            <span class="footer-handle">[@YOUR_HANDLE]</span>
            <div class="footer-progress">
              <div class="progress-bar"><div class="progress-fill"></div></div>
              <span class="page-num">[N]/[TOTAL]</span>
            </div>
          </div>

        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Section label (0.15s, power3.out)
      tl.from("#section-label", { opacity: 0, y: -14, duration: 0.35, ease: "power3.out" }, 0.15);

      // Headline slides in from left (0.3s, expo.out)
      tl.from("#headline", { opacity: 0, x: -55, duration: 0.5, ease: "expo.out" }, 0.3);

      // Body copy (0.7s, sine.out)
      tl.from("#body-copy", { opacity: 0, y: 16, duration: 0.4, ease: "sine.out" }, 0.7);

      // Cards stagger from bottom (0.9s, 0.15s apart, power2.out)
      tl.from("#card-1", { opacity: 0, y: 35, duration: 0.45, ease: "power2.out" }, 0.9);
      tl.from("#card-2", { opacity: 0, y: 35, duration: 0.45, ease: "power2.out" }, 1.05);
      tl.from("#card-3", { opacity: 0, y: 35, duration: 0.45, ease: "power2.out" }, 1.2);

      // Footer (1.6s, sine.out)
      tl.from("#footer", { opacity: 0, duration: 0.35, ease: "sine.out" }, 1.6);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
